<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>DevClub - Convert Money</title>
</head>

<body>
    <img class="logo" src="./assets/logo (1).gif" alt="convert-money">

    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>Real Brasileiro</option>
            </select>

        </label>

        <label>
            Converter Para
             <select>
                <option>US$ Dolar</option>
                <option>Euro</option>
            </select>
        </label>

        <label>
            Valor
            <input class="input-currency" placeholder="R$10.000"">
        </label>

        <button class="convert-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="assets/brasil 2.png" alt="logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <img class="arrow-img" src="./assets/seta.png" alt="seta">

            <div class="currency-box">
                <img src="./assets/eua.png" alt="moeda-convertida">
                <p>Dólar</p>
                <p class="currency-value">US$ 0.0</p>
            </div>

        </section>
    </main>
</body>
<script src="scripts.js"></script>
</html>
